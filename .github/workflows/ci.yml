name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No secrets: these suites cover the pure logic (scoring, dedupe, CSV
      # import planning) and never reach Supabase or a paid provider.
      - run: npm run typecheck

      - run: npm test
