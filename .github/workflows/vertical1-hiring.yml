name: Vertical 1 - Hiring signals

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC — GitHub's scheduler may delay this by a few minutes
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run run:vertical1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEB3_CAREER_API_TOKEN: ${{ secrets.WEB3_CAREER_API_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
